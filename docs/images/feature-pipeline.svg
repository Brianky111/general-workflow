<g class="amber"><rect x="260" y="424" width="160" height="56" rx="4"/><text class="th" x="340" y="445" text-anchor="middle" dominant-baseline="central">关卡③ 集成验收</text><text class="ts" x="340" y="463" text-anchor="middle" dominant-baseline="central">真环境 · 人眼过</text></g>
<g class="purple"><rect x="480" y="424" width="160" height="56" rx="4"/><text class="th" x="560" y="445" text-anchor="middle" dominant-baseline="central">09 完整性审计</text><text class="ts" x="560" y="463" text-anchor="middle" dominant-baseline="central">矩阵 · DoD · 证据</text></g>
<line class="arr" x1="200" y1="452" x2="250" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="452" x2="470" y2="452" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="480" x2="560" y2="510" marker-end="url(#arrow)"/>
<g class="green"><rect x="480" y="520" width="160" height="56" rx="4"/><text class="th" x="560" y="541" text-anchor="middle" dominant-baseline="central">功能完成</text><text class="ts" x="560" y="559" text-anchor="middle" dominant-baseline="central">归档 · 回归 · 经验沉淀</text></g>
<g class="gray"><rect x="40" y="632" width="180" height="56" rx="4"/><text class="th" x="130" y="653" text-anchor="middle" dominant-baseline="central">反例回收</text><text class="ts" x="130" y="671" text-anchor="middle" dominant-baseline="central">可复现失败必修</text></g>
<g class="gray"><rect x="250" y="632" width="180" height="56" rx="4"/><text class="th" x="340" y="653" text-anchor="middle" dominant-baseline="central">变更协议 A/B/C</text><text class="ts" x="340" y="671" text-anchor="middle" dominant-baseline="central">冻结后的一切变化</text></g>
<g class="gray"><rect x="460" y="632" width="180" height="56" rx="4"/><text class="th" x="550" y="653" text-anchor="middle" dominant-baseline="central">99 进度仪表盘</text><text class="ts" x="550" y="671" text-anchor="middle" dominant-baseline="central">进度 · 缺口 · 证据</text></g>
<g class="purple"><rect x="40" y="716" width="10" height="10" rx="2"/></g>
<text class="ts lg" x="58" y="721" dominant-baseline="central">流程阶段</text>

<text class="ts lg" x="154" y="721" dominant-baseline="central">用户关卡</text>
<g class="green"><rect x="236" y="716" width="10" height="10" rx="2"/></g>
<text class="ts lg" x="254" y="721" dominant-baseline="central">终态</text>

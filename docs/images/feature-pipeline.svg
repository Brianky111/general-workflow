<g class="amber"><rect x="260" y="232" width="160" height="56" rx="4"/><text class="th" x="340" y="253" text-anchor="middle" dominant-baseline="central">关卡① 合同冻结</text><text class="ts" x="340" y="271" text-anchor="middle" dominant-baseline="central">审计已附 · 用户批准</text></g>
<g class="purple"><rect x="480" y="232" width="160" height="56" rx="4"/><text class="th" x="560" y="253" text-anchor="middle" dominant-baseline="central">06 规划 · 测试矩阵</text><text class="ts" x="560" y="271" text-anchor="middle" dominant-baseline="central">实现方式 · 分层证据</text></g>
<line class="arr" x1="200" y1="260" x2="250" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="260" x2="470" y2="260" marker-end="url(#arrow)"/>
<line class="arr" x1="560" y1="288" x2="560" y2="318" marker-end="url(#arrow)"/>
<g class="amber"><rect x="480" y="328" width="160" height="56" rx="4"/><text class="th" x="560" y="349" text-anchor="middle" dominant-baseline="central">关卡② 规划冻结</text><text class="ts" x="560" y="367" text-anchor="middle" dominant-baseline="central">人审后生成 stub</text></g>
<g class="purple"><rect x="260" y="328" width="160" height="56" rx="4"/><text class="th" x="340" y="349" text-anchor="middle" dominant-baseline="central">07 红测</text><text class="ts" x="340" y="367" text-anchor="middle" dominant-baseline="central">先证明会失败</text></g>
<g class="purple"><rect x="40" y="328" width="160" height="56" rx="4"/><text class="th" x="120" y="349" text-anchor="middle" dominant-baseline="central">08 实现 · 重构</text><text class="ts" x="120" y="367" text-anchor="middle" dominant-baseline="central">最小转绿 · 绿后整理</text></g>
<line class="arr" x1="480" y1="356" x2="430" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="260" y1="356" x2="210" y2="356" marker-end="url(#arrow)"/>
<line class="arr" x1="120" y1="384" x2="120" y2="414" marker-end="url(#arrow)"/>

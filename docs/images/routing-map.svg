<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>general-workflow skill 请求入口与路由</title>
<desc>原始用户请求与明确接受的变更组成 Delivery Anchor。00-progress-router 先根据真实生产入口与最低可信证据判断 ANCHOR-SATISFIED、ANCHOR-UNMET 或 ANCHOR-BLOCKED；只有一个具名 request_gap 存在时才查询下游阶段，完成后立即收口。</desc>
<style>
.th{font:500 14px -apple-system,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.ts{font:400 12px -apple-system,'Segoe UI','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.75}
.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.75}
.amber .th{fill:#633806}.amber .ts{fill:#854F0B}
.green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.75}
.green .th{fill:#27500A}.green .ts{fill:#3B6D11}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.75}
.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.lg{fill:#888780}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="gray"><rect x="250" y="40" width="180" height="44" rx="4"/><text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Delivery Anchor</text></g>
<line class="arr" x1="340" y1="84" x2="340" y2="114" marker-end="url(#arrow)"/>
<g class="purple"><rect x="195" y="124" width="290" height="56" rx="4"/><text class="th" x="340" y="145" text-anchor="middle" dominant-baseline="central">先判 ANCHOR 状态</text><text class="ts" x="340" y="163" text-anchor="middle" dominant-baseline="central">满足即停 · 未满足只选一个 request_gap</text></g>
<line class="arr" x1="270" y1="180" x2="118" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="315" y1="180" x2="266" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="365" y1="180" x2="413" y2="230" marker-end="url(#arrow)"/>
<line class="arr" x1="410" y1="180" x2="562" y2="230" marker-end="url(#arrow)"/>
<g class="purple"><rect x="50" y="240" width="130" height="56" rx="4"/><text class="th" x="115" y="261" text-anchor="middle" dominant-baseline="central">最小项目开工</text><text class="ts" x="115" y="279" text-anchor="middle" dominant-baseline="central">首个纵向切片</text></g>
<g class="purple"><rect x="200" y="240" width="130" height="56" rx="4"/><text class="th" x="265" y="261" text-anchor="middle" dominant-baseline="central">重构准入</text><text class="ts" x="265" y="279" text-anchor="middle" dominant-baseline="central">不立 feature</text></g>
<g class="purple"><rect x="350" y="240" width="130" height="56" rx="4"/><text class="th" x="415" y="261" text-anchor="middle" dominant-baseline="central">相似裁决</text><text class="ts" x="415" y="279" text-anchor="middle" dominant-baseline="central">合并 · 修正 · 立新</text></g>
<g class="purple"><rect x="500" y="240" width="130" height="56" rx="4"/><text class="th" x="565" y="261" text-anchor="middle" dominant-baseline="central">功能请求</text><text class="ts" x="565" y="279" text-anchor="middle" dominant-baseline="central">READY 后直入代码</text></g>
<line class="arr" x1="115" y1="296" x2="115" y2="326" marker-end="url(#arrow)"/>
<line class="arr" x1="265" y1="296" x2="265" y2="326" marker-end="url(#arrow)"/>
<line class="arr" x1="415" y1="296" x2="415" y2="326" marker-end="url(#arrow)"/>
<line class="arr" x1="565" y1="296" x2="565" y2="326" marker-end="url(#arrow)"/>
<g class="purple"><rect x="40" y="336" width="150" height="56" rx="4"/><text class="th" x="115" y="357" text-anchor="middle" dominant-baseline="central">增量默认</text><text class="ts" x="115" y="375" text-anchor="middle" dominant-baseline="central">蓝图仅显式风险触发</text></g>
<g class="purple"><rect x="190" y="336" width="150" height="56" rx="4"/><text class="th" x="265" y="357" text-anchor="middle" dominant-baseline="central">纯重构直通实现</text><text class="ts" x="265" y="375" text-anchor="middle" dominant-baseline="central">行为变化走变更协议</text></g>
<g class="amber"><rect x="340" y="336" width="150" height="56" rx="4"/><text class="th" x="415" y="357" text-anchor="middle" dominant-baseline="central">问用户</text><text class="ts" x="415" y="375" text-anchor="middle" dominant-baseline="central">相似点 · 各案理由</text></g>
<g class="green"><rect x="500" y="336" width="130" height="56" rx="4"/><text class="th" x="565" y="357" text-anchor="middle" dominant-baseline="central">ANCHOR-SATISFIED</text><text class="ts" x="565" y="375" text-anchor="middle" dominant-baseline="central">收口一次后必须停</text></g>
<g class="purple"><rect x="40" y="424" width="10" height="10" rx="2"/></g>
<text class="ts lg" x="58" y="429" dominant-baseline="central">流程阶段</text>
<g class="amber"><rect x="140" y="424" width="10" height="10" rx="2"/></g>
<text class="ts lg" x="158" y="429" dominant-baseline="central">需要用户决策</text>
<g class="green"><rect x="270" y="424" width="10" height="10" rx="2"/></g>
<text class="ts lg" x="288" y="429" dominant-baseline="central">需求已完成，强制收口</text>
</svg>

interface:
  display_name: "Project Development Workflow"
  short_description: "Greenfield architecture-to-release workflow with refactor and takeover paths"
  default_prompt: "Guide this new project from its profile and requirements through architecture decisions, technology and repository scaffolding, a first vertical slice, TDD implementation, testing, CI/CD, release operations, and retrospective. Resume from the workflow state file when one exists, take the LEAN fast path when the profile allows it, run an authorized refactor as a refactor slice under the refactor path, bring a repository the workflow did not build in through the takeover entry -- run it, survey every entrypoint and module, derive a requirements document for the user to review, then baseline what they keep -- and load only the reference for the current stage."

policy:
  allow_implicit_invocation: true

interface:
  display_name: "General Workflow"
  short_description: "Original-request-anchored delivery with finite tests"
  default_prompt: "Use $general-workflow to treat my original request plus accepted deltas as the Delivery Anchor, first decide whether it is already complete through the real production path, and only when one concrete request_gap remains use concise BDD, existing-code reuse, finite anchor-linked tests, implementation, and verification to close it; stop immediately when the anchor is satisfied."

policy:
  allow_implicit_invocation: true

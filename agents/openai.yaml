interface:
  display_name: "Codebase-First Agent Workflow"
  short_description: "Trust-pyramid codebase guardrails, pstack /correct & /no-comments integration, and sharded verify_skill workflow"
  default_prompt: "Check the target repository with scripts/repo_guard.py first, prioritize Layer 1-2 architecture, types, and native lints with past-mistake falsification (/correct) and comment cleanup (/no-comments), scale verification with either .guardrails/feature-map.md or a sharded verify_skill plus fresh behavioral artifacts (and PBT/TLA+/Lean via vendor/pstack/ where warranted), and only enable outer-loop fuzzing or automerge once inner-loop trust gates hold."

policy:
  allow_implicit_invocation: true
